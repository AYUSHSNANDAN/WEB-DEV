<STYLE>
    .SUBSCRIBE-BUTTON
    {
        background-color: rgb(233, 21, 21);
        color: white;
        border: 0cap;
        height: 38px;
        width: 105px;
        border-radius: 3px;
        cursor: pointer;
        transition-delay: 160ms;
    } 
    .SUBSCRIBE-BUTTON:hover {
        opacity: 0.7;
    }
    .SUBSCRIBE-BUTTON:active {
        opacity: 0.5;
    }
    .JOIN 
    {
        background-color: white;
        color: rgb(15, 131, 240);
        border-color: rgb(15, 131, 240);
        height: 38px;
        width: 60px;
        border-radius: 3px;
        cursor: pointer;
        margin-left: 8px;
        transition-delay: 250ms,
        COLOR 200ms;
    }
    .JOIN:hover {
        background-color: rgb(15, 131, 240);
        color: white;
    }
    .JOIN:active {
        opacity: 0.7;
    }
    .TWEET 
    {
        background-color: rgb(51, 136, 248);
        color: white;
        border: NONE;
        height: 38px;
        width: 70px;
        border-radius: 18px;
        font-weight: bold;
        font-size: 15px;
        cursor: pointer;
        margin-left: 8px;
        transition: box-shadow 0.15s;
        
    }
    .TWEET:hover {
        box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.25);
    }
    
</STYLE>


<BUTTON CLASS="SUBSCRIBE-BUTTON">SUBSCRIBE</BUTTON>

<BUTTON CLASS="JOIN">JOIN</BUTTON>

<BUTTOn CLASS="TWEET">Tweet</BUTTOn>
